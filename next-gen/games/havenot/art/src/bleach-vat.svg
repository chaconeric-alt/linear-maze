<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Bleach vat, top-down: an open steel tub of white churning liquid, a paddle, a hazard rim, a drain valve. -->
  <defs>
    <radialGradient id="tub" cx="0.4" cy="0.35" r="0.7"><stop offset="0" stop-color="#d8e0e8"/><stop offset="0.7" stop-color="#6a747e"/><stop offset="1" stop-color="#2a3036"/></radialGradient>
    <radialGradient id="liquid" cx="0.45" cy="0.4" r="0.6"><stop offset="0" stop-color="#ffffff"/><stop offset="0.6" stop-color="#d8f0ff"/><stop offset="1" stop-color="#8ab8d8"/></radialGradient>
  </defs>
  <circle cx="33" cy="34" r="29" fill="#000" opacity="0.3"/>
  <circle cx="32" cy="32" r="29" fill="url(#tub)" stroke="#1a1e22" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="25" fill="none" stroke="#e8c030" stroke-width="3" stroke-dasharray="5 4"/>
  <circle cx="32" cy="32" r="21" fill="url(#liquid)"/>
  <!-- the churn: swirls and suds -->
  <path d="M18 30 C24 22 36 22 42 30 C36 40 26 40 22 34" stroke="#a8c8e0" stroke-width="1.5" fill="none"/>
  <g fill="#ffffff"><circle cx="24" cy="38" r="2"/><circle cx="40" cy="26" r="1.6"/><circle cx="36" cy="42" r="1.2"/><circle cx="20" cy="26" r="1.4"/></g>
  <!-- the paddle across the tub -->
  <rect x="8" y="30" width="48" height="4" rx="2" fill="#5a646c" stroke="#1a1e22" stroke-width="0.8"/>
  <circle cx="32" cy="32" r="4" fill="#3a4248"/>
  <!-- the drain valve -->
  <rect x="52" y="48" width="9" height="9" rx="2" fill="#c83a3a" stroke="#3a0a0a"/>
  <path d="M54 52.5 h5" stroke="#ffffff" stroke-width="1.2"/>
</svg>
