<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Agency Security Turret, top-down and aiming north: a clean corporate turret in brushed grey and
       office white, twin barrels, a blue status ring and the company's little smiley logo on the cowling. -->
  <defs>
    <radialGradient id="cowl" cx="0.4" cy="0.35" r="0.7"><stop offset="0" stop-color="#f4f6f8"/><stop offset="0.55" stop-color="#a8b0b8"/><stop offset="1" stop-color="#4a525a"/></radialGradient>
    <linearGradient id="barrel" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2a2e34"/><stop offset="0.5" stop-color="#7a828a"/><stop offset="1" stop-color="#2a2e34"/></linearGradient>
  </defs>
  <circle cx="32" cy="35" r="24" fill="#000" opacity="0.25"/>
  <!-- the base plate -->
  <rect x="12" y="15" width="40" height="40" rx="8" fill="#3a4048" stroke="#14181c" stroke-width="1.4"/>
  <g fill="#8a929a"><circle cx="16" cy="19" r="1.4"/><circle cx="48" cy="19" r="1.4"/><circle cx="16" cy="51" r="1.4"/><circle cx="48" cy="51" r="1.4"/></g>
  <!-- twin barrels -->
  <rect x="24" y="3" width="6" height="26" rx="2" fill="url(#barrel)" stroke="#14181c" stroke-width="0.8"/>
  <rect x="34" y="3" width="6" height="26" rx="2" fill="url(#barrel)" stroke="#14181c" stroke-width="0.8"/>
  <rect x="23" y="12" width="18" height="3" rx="1" fill="#5a626a"/>
  <!-- the cowling -->
  <circle cx="32" cy="35" r="14" fill="url(#cowl)" stroke="#2a3038" stroke-width="1.4"/>
  <circle cx="32" cy="35" r="16.5" fill="none" stroke="#3ab8ff" stroke-width="1.6" opacity="0.85"/>
  <!-- the company smiley -->
  <circle cx="32" cy="38" r="5" fill="#ffd84a" stroke="#8a6a10" stroke-width="0.6"/>
  <circle cx="30.3" cy="37" r="0.7" fill="#2a2010"/><circle cx="33.7" cy="37" r="0.7" fill="#2a2010"/>
  <path d="M29.6 39.4 Q32 41.4 34.4 39.4" stroke="#2a2010" stroke-width="0.7" fill="none"/>
  <!-- the sensor -->
  <rect x="28" y="23" width="8" height="4" rx="1.5" fill="#0a1420" stroke="#3ab8ff" stroke-width="0.6"/>
  <circle cx="32" cy="25" r="1.2" fill="#ff3a3a"/>
</svg>
