<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- Bombast Toad, top-down and facing north: a huge squat red-orange toad, its back crusted with warts and
       horns, a yellow belly glowing out from under its flanks, a row of green eyes along the brow. -->
  <defs>
    <radialGradient id="skin" cx="0.45" cy="0.4" r="0.65"><stop offset="0" stop-color="#ff8a3a"/><stop offset="0.55" stop-color="#d23a1a"/><stop offset="1" stop-color="#6a120a"/></radialGradient>
    <radialGradient id="belly" cx="0.5" cy="0.5" r="0.5"><stop offset="0.6" stop-color="#ffe84a" stop-opacity="0.9"/><stop offset="1" stop-color="#ffb02a" stop-opacity="0"/></radialGradient>
    <radialGradient id="eye" cx="0.4" cy="0.35" r="0.6"><stop offset="0" stop-color="#c8ffb0"/><stop offset="0.5" stop-color="#3aa83a"/><stop offset="1" stop-color="#0e3a10"/></radialGradient>
  </defs>
  <ellipse cx="48" cy="52" rx="40" ry="36" fill="#000" opacity="0.28"/>
  <!-- the belly's glow, out from under it -->
  <ellipse cx="48" cy="50" rx="40" ry="34" fill="url(#belly)"/>
  <!-- the legs, splayed: big hind feet, front hands -->
  <g fill="url(#skin)" stroke="#4a0c06" stroke-width="1.2">
    <path d="M18 66 Q4 70 4 84 L10 82 L12 88 L16 82 L22 86 L22 76 Z"/>
    <path d="M78 66 Q92 70 92 84 L86 82 L84 88 L80 82 L74 86 L74 76 Z"/>
    <path d="M22 30 Q10 26 8 16 L14 18 L14 12 L19 18 L22 14 L26 26 Z"/>
    <path d="M74 30 Q86 26 88 16 L82 18 L82 12 L77 18 L74 14 L70 26 Z"/>
  </g>
  <!-- the body -->
  <ellipse cx="48" cy="52" rx="32" ry="30" fill="url(#skin)" stroke="#4a0c06" stroke-width="1.6"/>
  <!-- yellow stripes down the flanks -->
  <path d="M20 44 Q18 56 24 68 M76 44 Q78 56 72 68" stroke="#ffd84a" stroke-width="2.4" fill="none" opacity="0.8" stroke-linecap="round"/>
  <!-- warts and horns down the back -->
  <g fill="#9a2418" stroke="#4a0c06" stroke-width="0.8">
    <circle cx="36" cy="50" r="4"/><circle cx="60" cy="50" r="4"/><circle cx="44" cy="62" r="3.6"/><circle cx="54" cy="64" r="3.2"/>
    <circle cx="30" cy="62" r="3"/><circle cx="66" cy="62" r="3"/><circle cx="48" cy="72" r="3.4"/><circle cx="38" cy="74" r="2.6"/><circle cx="58" cy="76" r="2.6"/>
  </g>
  <g fill="#6a1410" stroke="#2a0604" stroke-width="0.8">
    <path d="M42 44 L44 34 L47 44 Z"/><path d="M49 44 L52 34 L54 44 Z"/><path d="M32 40 L28 32 L36 38 Z"/><path d="M64 40 L68 32 L60 38 Z"/>
    <path d="M46 56 L48 48 L50 56 Z"/><path d="M40 68 L38 60 L44 66 Z"/><path d="M56 68 L58 60 L52 66 Z"/>
  </g>
  <!-- the head and its row of eyes -->
  <path d="M24 34 Q48 14 72 34 Q60 30 48 30 Q36 30 24 34 Z" fill="#c82a14" stroke="#4a0c06" stroke-width="1"/>
  <g stroke="#2a0604" stroke-width="1">
    <circle cx="32" cy="28" r="5" fill="url(#eye)"/><circle cx="43" cy="24" r="5.2" fill="url(#eye)"/>
    <circle cx="54" cy="24" r="5.2" fill="url(#eye)"/><circle cx="64" cy="28" r="5" fill="url(#eye)"/>
  </g>
  <g fill="#0a1a0a"><ellipse cx="32" cy="28" rx="2.4" ry="1.4"/><ellipse cx="43" cy="24" rx="2.4" ry="1.4"/><ellipse cx="54" cy="24" rx="2.4" ry="1.4"/><ellipse cx="64" cy="28" rx="2.4" ry="1.4"/></g>
  <path d="M30 20 Q48 12 66 20" stroke="#ffd0a0" stroke-width="1" fill="none" opacity="0.5"/>
</svg>
