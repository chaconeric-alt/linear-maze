<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Defense Field Emitter, top-down: a squat hexagonal agency pylon bolted to the floor, three field prongs
       round a humming blue orb, hazard trim, cable runs out to the walls. -->
  <defs>
    <radialGradient id="orb" cx="0.4" cy="0.35" r="0.6"><stop offset="0" stop-color="#ffffff"/><stop offset="0.35" stop-color="#8ad8ff"/><stop offset="1" stop-color="#1a4a8a"/></radialGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6a727c"/><stop offset="1" stop-color="#1a1e24"/></linearGradient>
    <pattern id="haz" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="#1a1a1a"/><rect width="2.5" height="5" fill="#e8c030"/></pattern>
  </defs>
  <circle cx="32" cy="34" r="27" fill="#000" opacity="0.25"/>
  <!-- cables off to the walls -->
  <path d="M8 52 Q2 58 0 64 M56 52 Q62 58 64 62" stroke="#14181c" stroke-width="2.4" fill="none"/>
  <!-- the hexagonal base with its hazard trim -->
  <path d="M32 4 L57 18 L57 46 L32 60 L7 46 L7 18 Z" fill="url(#haz)" stroke="#0a0c0e" stroke-width="1.4"/>
  <path d="M32 9 L53 21 L53 43 L32 55 L11 43 L11 21 Z" fill="url(#plate)" stroke="#0a0c0e" stroke-width="1.2"/>
  <g fill="#9aa2aa"><circle cx="32" cy="12" r="1.2"/><circle cx="50" cy="23" r="1.2"/><circle cx="50" cy="41" r="1.2"/><circle cx="32" cy="52" r="1.2"/><circle cx="14" cy="41" r="1.2"/><circle cx="14" cy="23" r="1.2"/></g>
  <!-- the three prongs -->
  <g fill="#3a424c" stroke="#0a0c0e" stroke-width="1">
    <path d="M30 12 L34 12 L35 24 L29 24 Z"/><path d="M49 42 L47 45.5 L37 38 L40 33 Z"/><path d="M15 42 L17 45.5 L27 38 L24 33 Z"/>
  </g>
  <g fill="#8ad8ff"><circle cx="32" cy="13" r="2"/><circle cx="48" cy="43" r="2"/><circle cx="16" cy="43" r="2"/></g>
  <!-- the orb -->
  <circle cx="32" cy="32" r="10" fill="#0a1a2a" stroke="#3a424c" stroke-width="1.4"/>
  <circle cx="32" cy="32" r="8" fill="url(#orb)"/>
  <circle cx="32" cy="32" r="13" fill="none" stroke="#8ad8ff" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.8"/>
</svg>
