<svg xmlns="http://www.w3.org/2000/svg" width="320" height="200" viewBox="0 0 320 200">
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a2a4a"/><stop offset="0.45" stop-color="#c8603a"/><stop offset="0.75" stop-color="#f0a85a"/><stop offset="1" stop-color="#f8d090"/></linearGradient>
    <linearGradient id="day" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7aa0b8"/><stop offset="0.6" stop-color="#d8c8a0"/><stop offset="1" stop-color="#f0dcb0"/></linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0b070"/><stop offset="1" stop-color="#a8703a"/></linearGradient>
    <linearGradient id="sandDark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b8844a"/><stop offset="1" stop-color="#6a4222"/></linearGradient>
    <linearGradient id="concrete" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9a948a"/><stop offset="0.6" stop-color="#7a746a"/><stop offset="1" stop-color="#4a463e"/></linearGradient>
    <linearGradient id="glassG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5ae8b0"/><stop offset="1" stop-color="#1a4a3a"/></linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a8e94"/><stop offset="0.5" stop-color="#4a4e54"/><stop offset="1" stop-color="#1a1c20"/></linearGradient>
    <radialGradient id="dark" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#000000"/><stop offset="0.7" stop-color="#0a0806"/><stop offset="1" stop-color="#2a1e10"/></radialGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fff4d0"/><stop offset="0.4" stop-color="#ffd890" stop-opacity="0.8"/><stop offset="1" stop-color="#ffd890" stop-opacity="0"/></radialGradient>
    <pattern id="haz" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#1a1a1a"/><rect width="4" height="8" fill="#e8c030"/></pattern>
  </defs>
  <!-- The Greasy Bolt Hole: a trench cut down into the sand, its walls showing riveted metal plating and a
       girder; at the bottom an open round hatch slick with black grease, its lid thrown back, nothing but darkness
       below; oily drips, a rusted ladder going down, a warning sign half buried at the rim. -->
  <rect width="320" height="200" fill="url(#day)"/>
  <path d="M0 74 Q80 62 160 68 Q240 60 320 66 V200 H0 Z" fill="url(#sand)"/>
  <!-- the trench: a ragged cut down through the dunes -->
  <path d="M30 86 Q60 78 96 84 Q130 76 168 82 Q210 74 250 80 Q276 78 292 86 Q262 120 240 156 L84 158 Q58 120 30 86 Z" fill="#5a3a1e"/>
  <path d="M30 86 Q58 120 84 158 L104 158 Q80 122 60 92 Z" fill="url(#sandDark)"/>
  <path d="M292 86 Q262 120 240 156 L222 156 Q246 120 268 90 Z" fill="#4a2e16"/>
  <!-- metal showing through the trench walls: buckled plating, a girder end -->
  <g stroke="#14100a" stroke-width="1">
    <path d="M78 100 L148 96 L150 112 L86 118 Z" fill="url(#metal)"/>
    <path d="M168 94 L236 98 L226 116 L170 112 Z" fill="url(#metal)"/>
    <path d="M100 124 L150 120 L148 134 L108 138 Z" fill="url(#metal)" opacity="0.85"/>
    <path d="M232 104 L262 92 L264 100 L236 112 Z" fill="#7a5a3a"/>
  </g>
  <g fill="#2a2420"><circle cx="90" cy="108" r="1.4"/><circle cx="114" cy="106" r="1.4"/><circle cx="138" cy="104" r="1.4"/><circle cx="182" cy="102" r="1.4"/><circle cx="206" cy="104" r="1.4"/><circle cx="224" cy="106" r="1.4"/></g>
  <path d="M96 104 q2 10 0 18 M140 104 q-2 8 0 16 M196 102 q2 10 -1 16 M220 106 q-1 8 1 14" stroke="#0a0806" stroke-width="2.6" opacity="0.85" fill="none"/>
  <ellipse cx="160" cy="160" rx="50" ry="16" fill="#1a120a"/>
  <ellipse cx="160" cy="158" rx="40" ry="12" fill="url(#metal)" stroke="#0a0806" stroke-width="1.4"/>
  <ellipse cx="160" cy="158" rx="32" ry="9" fill="url(#dark)"/>
  <path d="M196 152 Q220 128 214 112 L204 116 Q206 132 188 150 Z" fill="url(#metal)" stroke="#0a0806" stroke-width="1"/>
  <circle cx="209" cy="118" r="4" fill="none" stroke="#3a3a3a" stroke-width="2"/>
  <path d="M130 156 q-2 8 0 14 M150 166 q-1 6 1 10 M178 164 q2 6 0 12" stroke="#0a0806" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M132 150 q4 -2 8 0 M168 150 q4 -2 8 0" stroke="#d8c890" stroke-width="0.8" opacity="0.6"/>
  <g stroke="#6a3a1a" stroke-width="2.4"><path d="M120 120 L132 156 M130 118 L142 154"/><path d="M122 126 h10 M124 134 h10 M127 142 h10 M129 150 h10" stroke-width="1.6"/></g>
  <path d="M0 200 Q40 170 90 168 Q140 176 160 200 Z M190 200 Q240 168 320 172 V200 Z" fill="url(#sand)"/>
  <g transform="translate(262 62) rotate(14)"><rect x="-1.5" y="0" width="3" height="20" fill="#5a3a1a"/><path d="M0 -14 L12 6 H-12 Z" fill="#e8c030" stroke="#1a1a1a" stroke-width="1.4"/><text x="0" y="3" font-family="sans-serif" font-weight="700" font-size="10" text-anchor="middle" fill="#1a1a1a">!</text></g>
  <circle cx="160" cy="100" r="0.01" opacity="0"/>
</svg>
