<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Princess Eggbot, upright: a big pink command egg with a blue command band, lashes on her eye screen, a
       jewelled tiara, antenna masts, on gold-trimmed treads. -->
  <defs>
    <radialGradient id="shell" cx="0.36" cy="0.3" r="0.78"><stop offset="0" stop-color="#ffe8f4"/><stop offset="0.55" stop-color="#ffb8e0"/><stop offset="1" stop-color="#b8608a"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0a8"/><stop offset="0.5" stop-color="#e8b840"/><stop offset="1" stop-color="#8a5a18"/></linearGradient>
    <linearGradient id="tread" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1a1816"/><stop offset="0.5" stop-color="#3a3632"/><stop offset="1" stop-color="#1a1816"/></linearGradient>
    <radialGradient id="eye" cx="0.5" cy="0.5" r="0.6"><stop offset="0" stop-color="#ffffff"/><stop offset="0.4" stop-color="#ff7ad8"/><stop offset="1" stop-color="#5a0a3a"/></radialGradient>
  </defs>
  <ellipse cx="64" cy="118" rx="50" ry="7" fill="#000" opacity="0.3"/>
  <rect x="22" y="80" width="84" height="22" rx="5" fill="#3a3632" stroke="url(#gold)" stroke-width="2"/>
  <rect x="10" y="70" width="22" height="46" rx="9" fill="url(#tread)" stroke="#0a0908"/>
  <rect x="96" y="70" width="22" height="46" rx="9" fill="url(#tread)" stroke="#0a0908"/>
  <path d="M12 76 h18 M12 83 h18 M12 90 h18 M12 97 h18 M12 104 h18 M12 111 h18 M98 76 h18 M98 83 h18 M98 90 h18 M98 97 h18 M98 104 h18 M98 111 h18" stroke="#6a645a" stroke-width="2"/>
  <g fill="url(#gold)"><circle cx="21" cy="76" r="4"/><circle cx="21" cy="110" r="4"/><circle cx="107" cy="76" r="4"/><circle cx="107" cy="110" r="4"/></g>
  <!-- the egg -->
  <ellipse cx="64" cy="56" rx="34" ry="44" fill="url(#shell)" stroke="#2a1018" stroke-width="2.5"/>
  <path d="M31 72 Q64 84 97 72 L96 80 Q64 92 32 80 Z" fill="#3a6ad8"/>
  <text x="64" y="83" font-family="sans-serif" font-size="7" font-weight="bold" fill="#ffffff" text-anchor="middle">COMMAND</text>
  <!-- the eye screen with lashes -->
  <rect x="36" y="42" width="56" height="14" rx="5" fill="#2a1018"/>
  <ellipse cx="52" cy="49" rx="6" ry="4.5" fill="url(#eye)"/><ellipse cx="76" cy="49" rx="6" ry="4.5" fill="url(#eye)"/>
  <path d="M44 42 l-2 -6 M50 42 l0 -6 M56 42 l2 -6 M70 42 l-2 -6 M76 42 l0 -6 M82 42 l2 -6" stroke="#2a1018" stroke-width="1.6" stroke-linecap="round"/>
  <ellipse cx="50" cy="28" rx="7" ry="12" fill="#ffffff" opacity="0.5" transform="rotate(-25 50 28)"/>
  <!-- tiara and masts -->
  <path d="M44 16 L48 4 L56 13 L64 0 L72 13 L80 4 L84 16 Z" fill="url(#gold)" stroke="#6a4010" stroke-width="1"/>
  <circle cx="64" cy="8" r="3" fill="#7ae8ff"/><circle cx="50" cy="11" r="2" fill="#ff4a8a"/><circle cx="78" cy="11" r="2" fill="#ff4a8a"/>
  <path d="M30 34 L18 14 M98 34 L110 14" stroke="#3a3632" stroke-width="2"/>
  <circle cx="18" cy="13" r="3" fill="#ff7ad8"/><circle cx="110" cy="13" r="3" fill="#ff7ad8"/>
</svg>
