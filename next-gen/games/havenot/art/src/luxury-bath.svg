<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Luxury bath, top-down: a sunken marble tub of steaming water, gold taps, steps, towels and candles. -->
  <defs>
    <linearGradient id="marble" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f0ec"/><stop offset="0.6" stop-color="#d8d0c8"/><stop offset="1" stop-color="#a8a098"/></linearGradient>
    <radialGradient id="water" cx="0.45" cy="0.4" r="0.65"><stop offset="0" stop-color="#d8f8ff"/><stop offset="0.6" stop-color="#5ac8e8"/><stop offset="1" stop-color="#1a6a8a"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0a8"/><stop offset="0.5" stop-color="#d8a838"/><stop offset="1" stop-color="#7a5418"/></linearGradient>
  </defs>
  <rect x="5" y="6" width="120" height="120" rx="14" fill="#000" opacity="0.3"/>
  <rect x="2" y="2" width="120" height="120" rx="14" fill="url(#marble)" stroke="#8a827a" stroke-width="2"/>
  <path d="M10 30 C30 24 40 40 60 34 M70 100 C80 92 96 104 110 96" stroke="#b8b0a8" stroke-width="1" fill="none" opacity="0.7"/>
  <!-- the tub, sunken, gold-rimmed -->
  <rect x="16" y="16" width="92" height="80" rx="20" fill="url(#gold)"/>
  <rect x="20" y="20" width="84" height="72" rx="17" fill="url(#water)"/>
  <!-- ripples and steam -->
  <ellipse cx="62" cy="56" rx="22" ry="14" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.5"/>
  <ellipse cx="62" cy="56" rx="10" ry="6" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
  <g fill="#ffffff" opacity="0.35"><circle cx="40" cy="40" r="6"/><circle cx="84" cy="70" r="7"/><circle cx="76" cy="36" r="4"/></g>
  <!-- the taps -->
  <rect x="54" y="8" width="16" height="10" rx="3" fill="url(#gold)" stroke="#5a3a10"/>
  <circle cx="50" cy="12" r="3" fill="url(#gold)"/><circle cx="74" cy="12" r="3" fill="url(#gold)"/>
  <!-- steps down into it -->
  <rect x="44" y="96" width="36" height="8" rx="2" fill="#e8e0d8" stroke="#a8a098"/><rect x="48" y="104" width="28" height="8" rx="2" fill="#f4f0ec" stroke="#a8a098"/>
  <!-- folded towels and candles at the corners -->
  <rect x="96" y="100" width="18" height="14" rx="2" fill="#f8f0f8" stroke="#c8b8c8"/><path d="M96 105 h18" stroke="#c8b8c8"/>
  <g><circle cx="12" cy="12" r="3" fill="#fff8e8"/><circle cx="12" cy="12" r="1.2" fill="#ffb040"/><circle cx="112" cy="12" r="3" fill="#fff8e8"/><circle cx="112" cy="12" r="1.2" fill="#ffb040"/><circle cx="12" cy="112" r="3" fill="#fff8e8"/><circle cx="12" cy="112" r="1.2" fill="#ffb040"/></g>
</svg>
