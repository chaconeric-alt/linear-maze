<svg xmlns="http://www.w3.org/2000/svg" width="128" height="64" viewBox="0 0 128 64">
  <!-- Press, top-down: a hydraulic press's head over its bed, four guide columns, warning chevrons, a stamp. -->
  <defs>
    <linearGradient id="bed" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7a8268"/><stop offset="1" stop-color="#2e3424"/></linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c8ccc0"/><stop offset="1" stop-color="#5a5e54"/></linearGradient>
  </defs>
  <rect x="4" y="6" width="122" height="56" rx="3" fill="#000" opacity="0.3"/>
  <rect x="2" y="2" width="122" height="56" rx="3" fill="url(#bed)" stroke="#14180e" stroke-width="2"/>
  <!-- warning chevrons along the edge -->
  <path d="M6 6 l6 6 l6 -6 l6 6 l6 -6 l6 6 l6 -6 l6 6 l6 -6 l6 6 l6 -6 l6 6 l6 -6 l6 6 l6 -6 l6 6 l6 -6 l6 6 l6 -6" stroke="#e8c030" stroke-width="2" fill="none"/>
  <!-- the guide columns -->
  <g fill="#c8ccc0" stroke="#14180e"><circle cx="16" cy="22" r="5"/><circle cx="110" cy="22" r="5"/><circle cx="16" cy="48" r="5"/><circle cx="110" cy="48" r="5"/></g>
  <!-- the head, with its hydraulic ram -->
  <rect x="24" y="16" width="78" height="38" rx="3" fill="url(#head)" stroke="#14180e" stroke-width="1.5"/>
  <circle cx="63" cy="35" r="12" fill="#5a5e54" stroke="#14180e" stroke-width="1.5"/>
  <circle cx="63" cy="35" r="6" fill="#2a2e26"/>
  <!-- the stamp face, readable from above -->
  <rect x="30" y="20" width="18" height="10" rx="1" fill="#2a2e26"/>
  <text x="39" y="28" font-family="sans-serif" font-size="6.5" font-weight="bold" fill="#c83a3a" text-anchor="middle">OK</text>
  <!-- hoses -->
  <path d="M102 30 C114 30 118 40 124 40" stroke="#1a1a1a" stroke-width="3" fill="none"/>
  <path d="M102 40 C112 42 116 52 124 52" stroke="#c83a3a" stroke-width="2.5" fill="none"/>
</svg>
