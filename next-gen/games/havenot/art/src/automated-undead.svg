<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Automated undead, top-down and facing north: a funeral-home robot corpse got up and walking, a rusted
       skeletal frame in the rags of a burial suit, one arm reaching forward, a sickly green eye in a cracked
       skull plate, cables trailing like sinews. -->
  <defs>
    <radialGradient id="skull" cx="0.4" cy="0.35" r="0.7"><stop offset="0" stop-color="#c8b8a0"/><stop offset="0.6" stop-color="#6a5a48"/><stop offset="1" stop-color="#2a2218"/></radialGradient>
    <linearGradient id="rust" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a5a3a"/><stop offset="1" stop-color="#3a2216"/></linearGradient>
  </defs>
  <ellipse cx="32" cy="36" rx="18" ry="16" fill="#000" opacity="0.28"/>
  <!-- the burial suit, in rags -->
  <path d="M18 30 L46 30 L44 48 L40 44 L36 50 L32 45 L28 51 L24 44 L20 48 Z" fill="#1e1e26" stroke="#0a0a0e" stroke-width="1"/>
  <path d="M30 30 L32 40 L34 30" fill="#d8d0c0" opacity="0.6"/>
  <!-- ribs, through the tears -->
  <path d="M24 36 h6 M34 36 h6 M25 40 h5 M34 40 h5" stroke="#a89880" stroke-width="1.2" opacity="0.8"/>
  <!-- the arms: one reaching forward, one hanging -->
  <path d="M20 31 L14 22 L14 10" stroke="url(#rust)" stroke-width="3.6" fill="none" stroke-linecap="round"/>
  <path d="M11 9 L14 6 L17 9 M14 6 V3" stroke="#a89880" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <path d="M44 31 L50 40 L50 48" stroke="url(#rust)" stroke-width="3.6" fill="none" stroke-linecap="round"/>
  <path d="M47 49 L50 52 L53 49" stroke="#a89880" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <!-- shoulder bar -->
  <rect x="16" y="27" width="32" height="6" rx="3" fill="url(#rust)" stroke="#1a100a" stroke-width="1"/>
  <!-- trailing cables -->
  <path d="M28 50 Q26 56 30 62 M36 49 Q40 55 37 61" stroke="#3a3a2a" stroke-width="1.2" fill="none"/>
  <!-- the skull plate, cracked, with its one eye -->
  <ellipse cx="32" cy="22" rx="8" ry="8.5" fill="url(#skull)" stroke="#1a140c" stroke-width="1.2"/>
  <path d="M28 16 L31 20 L29 24" stroke="#1a140c" stroke-width="0.9" fill="none"/>
  <circle cx="35" cy="18.5" r="2.6" fill="#0a1a08"/><circle cx="35" cy="18.5" r="1.6" fill="#9aff6a"/>
  <circle cx="29" cy="18.5" r="2.2" fill="#0a0a08"/>
  <path d="M28 25 h8" stroke="#1a140c" stroke-width="0.8"/><path d="M29 25 v1.6 M31 25 v1.6 M33 25 v1.6 M35 25 v1.6" stroke="#1a140c" stroke-width="0.6"/>
</svg>
