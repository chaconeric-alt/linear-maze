<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Power core turbine, top-down: a shrouded fan over a glowing core, hazard-striped housing, conduits out. -->
  <defs>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffffff"/><stop offset="0.3" stop-color="#9af0ff"/><stop offset="0.7" stop-color="#1a8ab8"/><stop offset="1" stop-color="#062a40"/></radialGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3a4248"/><stop offset="0.5" stop-color="#b8c4cc"/><stop offset="1" stop-color="#3a4248"/></linearGradient>
    <pattern id="hazard" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#1a1a1a"/><rect width="6" height="12" fill="#e8c030"/></pattern>
  </defs>
  <!-- conduits -->
  <path d="M0 64 H16 M112 64 H128 M64 0 V14" stroke="#2a3036" stroke-width="10"/>
  <path d="M0 64 H16 M112 64 H128 M64 0 V14" stroke="#4ad8ff" stroke-width="2" opacity="0.7"/>
  <!-- housing -->
  <rect x="12" y="12" width="104" height="104" rx="14" fill="url(#hazard)"/>
  <rect x="18" y="18" width="92" height="92" rx="10" fill="#2a3036" stroke="#0e1114" stroke-width="2"/>
  <circle cx="64" cy="64" r="42" fill="#0a0e12" stroke="#5a646c" stroke-width="3"/>
  <circle cx="64" cy="64" r="30" fill="url(#core)"/>
  <!-- the fan, six blades -->
  <g transform="translate(64 64)" stroke="#0e1114" stroke-width="1">
    <path d="M0 -6 C10 -20 8 -34 2 -40 L-6 -38 C-2 -26 -4 -14 -6 -6 Z" fill="url(#blade)"/>
    <path d="M0 -6 C10 -20 8 -34 2 -40 L-6 -38 C-2 -26 -4 -14 -6 -6 Z" fill="url(#blade)" transform="rotate(60)"/>
    <path d="M0 -6 C10 -20 8 -34 2 -40 L-6 -38 C-2 -26 -4 -14 -6 -6 Z" fill="url(#blade)" transform="rotate(120)"/>
    <path d="M0 -6 C10 -20 8 -34 2 -40 L-6 -38 C-2 -26 -4 -14 -6 -6 Z" fill="url(#blade)" transform="rotate(180)"/>
    <path d="M0 -6 C10 -20 8 -34 2 -40 L-6 -38 C-2 -26 -4 -14 -6 -6 Z" fill="url(#blade)" transform="rotate(240)"/>
    <path d="M0 -6 C10 -20 8 -34 2 -40 L-6 -38 C-2 -26 -4 -14 -6 -6 Z" fill="url(#blade)" transform="rotate(300)"/>
    <circle r="8" fill="#5a646c"/><circle r="3" fill="#ffffff"/>
  </g>
  <!-- the shroud's grille -->
  <circle cx="64" cy="64" r="42" fill="none" stroke="#7a848c" stroke-width="1.5" stroke-dasharray="3 3"/>
  <!-- gauges -->
  <rect x="22" y="94" width="16" height="10" rx="2" fill="#0a0e12" stroke="#7a848c"/><rect x="24" y="96" width="9" height="6" fill="#4ad8ff"/>
  <rect x="90" y="22" width="16" height="10" rx="2" fill="#0a0e12" stroke="#7a848c"/><rect x="92" y="24" width="5" height="6" fill="#ff7a2a"/>
</svg>
