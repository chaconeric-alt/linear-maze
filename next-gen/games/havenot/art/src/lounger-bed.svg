<svg xmlns="http://www.w3.org/2000/svg" width="64" height="128" viewBox="0 0 64 128">
  <!-- Lounger bed, top-down: a deep padded VIP lounger, its head to the north, pillows, a throw, a side table. -->
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1a1a22"/><stop offset="0.5" stop-color="#4a4a5a"/><stop offset="1" stop-color="#1a1a22"/></linearGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8e0f0"/><stop offset="1" stop-color="#a898b8"/></linearGradient>
    <linearGradient id="throw" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c85aa8"/><stop offset="1" stop-color="#5a1a4a"/></linearGradient>
  </defs>
  <rect x="5" y="6" width="56" height="120" rx="10" fill="#000" opacity="0.3"/>
  <rect x="3" y="3" width="56" height="120" rx="10" fill="url(#frame)" stroke="#d8a838" stroke-width="1.5"/>
  <!-- the raised head -->
  <rect x="8" y="8" width="46" height="30" rx="8" fill="url(#pad)"/>
  <path d="M16 12 v22 M31 12 v22 M46 12 v22" stroke="#9888a8" stroke-width="1"/>
  <!-- pillows -->
  <ellipse cx="21" cy="30" rx="10" ry="6" fill="#ffffff"/><ellipse cx="41" cy="30" rx="10" ry="6" fill="#f0e8f8"/>
  <!-- the body, tufted -->
  <rect x="8" y="40" width="46" height="78" rx="6" fill="url(#pad)"/>
  <g fill="#a898b8"><circle cx="20" cy="54" r="1.4"/><circle cx="42" cy="54" r="1.4"/><circle cx="31" cy="66" r="1.4"/><circle cx="20" cy="78" r="1.4"/><circle cx="42" cy="78" r="1.4"/></g>
  <!-- the throw across the foot -->
  <path d="M8 84 L54 76 L54 118 Q54 118 48 118 L14 118 Q8 118 8 112 Z" fill="url(#throw)"/>
  <path d="M8 84 L54 76" stroke="#ffd0f0" stroke-width="1.5"/>
  <!-- a side table with a glass -->
  <circle cx="58" cy="60" r="6" fill="#2a2a34" stroke="#d8a838"/>
  <circle cx="58" cy="60" r="2.5" fill="#ffb0d8" opacity="0.8"/>
</svg>
