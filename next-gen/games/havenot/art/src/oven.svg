<svg xmlns="http://www.w3.org/2000/svg" width="128" height="64" viewBox="0 0 128 64">
  <!-- Fabrication oven, top-down: a long industrial oven, its window glowing, a flue, burners and a control strip. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a8e92"/><stop offset="1" stop-color="#3a3e42"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.6"><stop offset="0" stop-color="#fff0a0"/><stop offset="0.5" stop-color="#ff8a1a"/><stop offset="1" stop-color="#6a1a04"/></radialGradient>
  </defs>
  <rect x="4" y="6" width="122" height="56" rx="4" fill="#000" opacity="0.3"/>
  <rect x="2" y="2" width="122" height="56" rx="4" fill="url(#body)" stroke="#1a1c1e" stroke-width="2"/>
  <!-- the window into the oven -->
  <rect x="10" y="12" width="66" height="34" rx="4" fill="#1a0a04" stroke="#5a5e62" stroke-width="2"/>
  <rect x="14" y="16" width="58" height="26" rx="2" fill="url(#glow)"/>
  <path d="M18 24 h50 M18 34 h50" stroke="#3a1004" stroke-width="1.5"/>
  <rect x="24" y="26" width="16" height="6" rx="1" fill="#6a2a0a"/><rect x="48" y="26" width="14" height="6" rx="1" fill="#6a2a0a"/>
  <!-- the burners -->
  <g><circle cx="92" cy="18" r="7" fill="#1a1c1e" stroke="#6a6e72"/><circle cx="92" cy="18" r="3" fill="#ff6a1a"/>
     <circle cx="110" cy="18" r="7" fill="#1a1c1e" stroke="#6a6e72"/><circle cx="110" cy="18" r="3" fill="#4a1a0a"/></g>
  <!-- the flue -->
  <circle cx="104" cy="42" r="9" fill="#2a2c2e" stroke="#6a6e72" stroke-width="2"/><circle cx="104" cy="42" r="4" fill="#0a0a0a"/>
  <!-- the control strip -->
  <rect x="10" y="50" width="66" height="5" fill="#1a1c1e"/>
  <g fill="#e8c030"><circle cx="16" cy="52.5" r="1.4"/><circle cx="24" cy="52.5" r="1.4"/></g><circle cx="32" cy="52.5" r="1.4" fill="#ff3a2a"/>
</svg>
