<svg xmlns="http://www.w3.org/2000/svg" width="192" height="64" viewBox="0 0 192 64">
  <!-- Conveyor, top-down: a rubber belt over rollers between steel side rails, crates riding it, a chute at the end. -->
  <defs>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c8ccd0"/><stop offset="1" stop-color="#4a5258"/></linearGradient>
    <linearGradient id="belt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2a28"/><stop offset="0.5" stop-color="#3a3a36"/><stop offset="1" stop-color="#1a1a18"/></linearGradient>
    <linearGradient id="crate" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c8904a"/><stop offset="1" stop-color="#6a4420"/></linearGradient>
  </defs>
  <rect x="4" y="8" width="186" height="54" rx="3" fill="#000" opacity="0.3"/>
  <rect x="2" y="6" width="176" height="52" fill="url(#belt)"/>
  <!-- belt treads -->
  <path d="M10 10 v44 M22 10 v44 M34 10 v44 M46 10 v44 M58 10 v44 M70 10 v44 M82 10 v44 M94 10 v44 M106 10 v44 M118 10 v44 M130 10 v44 M142 10 v44 M154 10 v44 M166 10 v44" stroke="#4a4a46" stroke-width="2"/>
  <!-- side rails, bolted -->
  <rect x="0" y="2" width="180" height="7" fill="url(#rail)" stroke="#2a3036" stroke-width="0.8"/>
  <rect x="0" y="55" width="180" height="7" fill="url(#rail)" stroke="#2a3036" stroke-width="0.8"/>
  <g fill="#2a3036"><circle cx="8" cy="5.5" r="1.3"/><circle cx="48" cy="5.5" r="1.3"/><circle cx="88" cy="5.5" r="1.3"/><circle cx="128" cy="5.5" r="1.3"/><circle cx="168" cy="5.5" r="1.3"/><circle cx="8" cy="58.5" r="1.3"/><circle cx="48" cy="58.5" r="1.3"/><circle cx="88" cy="58.5" r="1.3"/><circle cx="128" cy="58.5" r="1.3"/><circle cx="168" cy="58.5" r="1.3"/></g>
  <!-- what it carries -->
  <rect x="24" y="16" width="30" height="30" rx="2" fill="url(#crate)" stroke="#3a2410"/><path d="M24 31 h30 M39 16 v30" stroke="#3a2410" stroke-width="1"/>
  <rect x="96" y="20" width="24" height="24" rx="2" fill="url(#crate)" stroke="#3a2410"/><path d="M96 32 h24" stroke="#3a2410" stroke-width="1"/>
  <ellipse cx="150" cy="32" rx="10" ry="12" fill="#5a6a4a" stroke="#2a3020"/>
  <!-- direction arrows -->
  <path d="M68 32 l8 -5 v10 Z M134 32 l8 -5 v10 Z" fill="#e8c030" opacity="0.8"/>
  <!-- the chute at the end -->
  <path d="M178 4 L192 14 L192 50 L178 60 Z" fill="#3a4248" stroke="#1a1e22"/>
  <path d="M182 20 h6 M182 32 h6 M182 44 h6" stroke="#e8c030" stroke-width="2"/>
</svg>
