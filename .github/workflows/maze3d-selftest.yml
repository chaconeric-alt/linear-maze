# maze3d: the self-test baseline on every push and pull request that touches maze3d/.
# It runs maze3d/tests/run_baseline.py (every run in maze3d/tests/baseline.txt, repeatable, with --fixed-fps 60) on
# headless Godot, fails if any run fails a check, hits a script error or prints no result, and keeps the logs.
name: maze3d self-test

on:
  push:
    paths:
      - "maze3d/**"
      - ".github/workflows/maze3d-selftest.yml"
  pull_request:
    paths:
      - "maze3d/**"
      - ".github/workflows/maze3d-selftest.yml"
  workflow_dispatch:

concurrency:                       # a newer push to the same branch replaces a run still going
  group: maze3d-selftest-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Godot (cached)
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot

      # Godot's imported models: re-importing every model takes minutes, and only what changed needs doing again.
      - name: Imported files (cached)
        uses: actions/cache@v4
        with:
          path: maze3d/.godot
          key: godot-import-${{ env.GODOT_VERSION }}-${{ hashFiles('maze3d/**/*.import', 'maze3d/project.godot') }}
          restore-keys: godot-import-${{ env.GODOT_VERSION }}-

      - name: Import
        run: ~/godot/godot --headless --path maze3d --import || true

      - name: Self-test baseline
        run: |
          set -o pipefail
          status=0
          python3 maze3d/tests/run_baseline.py --jobs 3 --godot ~/godot/godot | tee baseline.txt || status=$?
          { echo '```'; cat baseline.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-logs
          path: maze3d/tests/out/
          retention-days: 14
