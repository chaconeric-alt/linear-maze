<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Gladiator Roach, top-down and facing north: a glossy brown cockroach the size of a cat, a scrap-metal
       shoulder plate strapped over its wing cases and a red crest on its helmet, long whipping antennae. -->
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2a1408"/><stop offset="0.45" stop-color="#8a4a1a"/><stop offset="0.55" stop-color="#a85e24"/><stop offset="1" stop-color="#2a1408"/></linearGradient>
    <linearGradient id="tin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d0d4d8"/><stop offset="1" stop-color="#6a7078"/></linearGradient>
  </defs>
  <ellipse cx="32" cy="38" rx="16" ry="20" fill="#000" opacity="0.28"/>
  <!-- legs, spiny -->
  <g stroke="#2a1408" stroke-width="1.6" stroke-linecap="round" fill="none">
    <path d="M24 28 L14 24 L10 18 M23 36 L12 38 L6 36 M24 44 L14 52 L12 60"/>
    <path d="M40 28 L50 24 L54 18 M41 36 L52 38 L58 36 M40 44 L50 52 L52 60"/>
  </g>
  <!-- antennae, long -->
  <path d="M29 16 Q20 6 8 2 M35 16 Q44 6 56 2" stroke="#4a2810" stroke-width="1" fill="none"/>
  <!-- the wing cases -->
  <path d="M32 24 Q20 26 21 44 Q24 56 32 58 Q40 56 43 44 Q44 26 32 24 Z" fill="url(#shell)" stroke="#1a0a04" stroke-width="1.2"/>
  <path d="M32 26 V57" stroke="#1a0a04" stroke-width="1"/>
  <path d="M25 34 Q28 44 30 52 M39 34 Q36 44 34 52" stroke="#d8945a" stroke-width="0.8" fill="none" opacity="0.6"/>
  <!-- the scrap shoulder plate, strapped on -->
  <path d="M22 26 Q32 20 42 26 L40 32 Q32 28 24 32 Z" fill="url(#tin)" stroke="#3a3e44" stroke-width="0.8"/>
  <g fill="#3a3e44"><circle cx="25" cy="28" r="0.8"/><circle cx="39" cy="28" r="0.8"/><circle cx="32" cy="25" r="0.8"/></g>
  <path d="M21 38 Q32 41 43 38" stroke="#5a3a1a" stroke-width="1.6" fill="none"/>
  <!-- the head, helmeted, with the crest -->
  <ellipse cx="32" cy="19" rx="6" ry="5" fill="url(#tin)" stroke="#3a3e44" stroke-width="0.8"/>
  <path d="M32 13 Q35 18 32 24 Q29 18 32 13 Z" fill="#c82a1a" stroke="#5a0a06" stroke-width="0.5"/>
  <circle cx="28.5" cy="17" r="1.2" fill="#1a0a04"/><circle cx="35.5" cy="17" r="1.2" fill="#1a0a04"/>
</svg>
