<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Hollow Grease Monkey, top-down and facing north: an empty olive trooper's armour still walking its post,
       the helmet open on nothing but dark, grease smeared over the pauldrons, a grease hose and nozzle held
       forward, the tank on its back. -->
  <defs>
    <radialGradient id="plate" cx="0.4" cy="0.35" r="0.7"><stop offset="0" stop-color="#9a9a5a"/><stop offset="0.55" stop-color="#4e4e2a"/><stop offset="1" stop-color="#1a1a0c"/></radialGradient>
    <radialGradient id="void" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#000000"/><stop offset="0.8" stop-color="#0a0a06"/><stop offset="1" stop-color="#2a2a14"/></radialGradient>
  </defs>
  <ellipse cx="32" cy="36" rx="22" ry="18" fill="#000" opacity="0.28"/>
  <!-- the grease tank, on its back -->
  <rect x="24" y="40" width="16" height="16" rx="5" fill="#3a3020" stroke="#120e06" stroke-width="1.2"/>
  <path d="M26 44 h12 M26 48 h12 M26 52 h12" stroke="#6a5a3a" stroke-width="1"/>
  <!-- the hose, from tank to nozzle -->
  <path d="M38 50 Q52 48 50 34 Q48 22 44 14" stroke="#1a1a10" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- arms: the nozzle in both hands, forward -->
  <path d="M18 32 L22 20 L38 14 M46 32 L44 20 L40 14" stroke="url(#plate)" stroke-width="5" fill="none" stroke-linecap="round"/>
  <rect x="38" y="4" width="6" height="14" rx="1.5" fill="#5a5a60" stroke="#1a1a1e" stroke-width="1"/>
  <rect x="39" y="1" width="4" height="4" fill="#2a2a2e"/>
  <!-- the torso and pauldrons -->
  <ellipse cx="32" cy="34" rx="13" ry="10" fill="url(#plate)" stroke="#12120a" stroke-width="1.3"/>
  <ellipse cx="17" cy="32" rx="6" ry="7" fill="url(#plate)" stroke="#12120a" stroke-width="1.2"/>
  <ellipse cx="47" cy="32" rx="6" ry="7" fill="url(#plate)" stroke="#12120a" stroke-width="1.2"/>
  <!-- grease smears -->
  <path d="M14 30 q4 4 2 8 M45 28 q3 4 6 4 M26 36 q4 2 8 -1" stroke="#0e0c06" stroke-width="2" opacity="0.65" fill="none" stroke-linecap="round"/>
  <path d="M28 40 q0 4 1 6" stroke="#0e0c06" stroke-width="1.4" opacity="0.6" fill="none"/>
  <!-- the helmet: open, hollow -->
  <circle cx="32" cy="28" r="8" fill="url(#plate)" stroke="#12120a" stroke-width="1.3"/>
  <ellipse cx="32" cy="26" rx="5.5" ry="4.5" fill="url(#void)"/>
  <circle cx="30" cy="25" r="0.7" fill="#ffd84a" opacity="0.5"/><circle cx="34" cy="25" r="0.7" fill="#ffd84a" opacity="0.5"/>
  <rect x="29" y="20" width="6" height="2.4" rx="1" fill="#c8c050" opacity="0.8"/>
</svg>
