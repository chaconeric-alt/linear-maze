<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Vending kiosk, top-down: a glass-fronted cabinet of goods in spiral racks, a keypad, a ticket dispenser. -->
  <defs>
    <linearGradient id="cab" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e84a4a"/><stop offset="1" stop-color="#6a0a14"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.05"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.2"/></linearGradient>
  </defs>
  <rect x="4" y="6" width="56" height="56" rx="4" fill="#000" opacity="0.3"/>
  <rect x="2" y="2" width="56" height="56" rx="4" fill="url(#cab)" stroke="#2a0408" stroke-width="2"/>
  <!-- the goods, three rows -->
  <rect x="6" y="6" width="36" height="42" fill="#1a1418"/>
  <g stroke="#7a7a80" stroke-width="0.8" fill="none"><path d="M6 20 h36 M6 34 h36"/></g>
  <g><rect x="8" y="9" width="7" height="9" fill="#ffe04a"/><rect x="18" y="9" width="7" height="9" fill="#4ad8ff"/><rect x="28" y="9" width="7" height="9" fill="#ff7ad8"/>
     <rect x="8" y="23" width="7" height="9" fill="#7aff6a"/><rect x="18" y="23" width="7" height="9" fill="#ff7a3a"/><rect x="28" y="23" width="7" height="9" fill="#ffe04a"/>
     <rect x="8" y="37" width="7" height="9" fill="#c8c8ff"/><rect x="28" y="37" width="7" height="9" fill="#4ad8ff"/></g>
  <rect x="6" y="6" width="36" height="42" fill="url(#glass)" stroke="#d8e0e8" stroke-width="1" stroke-opacity="0.6"/>
  <!-- keypad and coin slot -->
  <rect x="45" y="8" width="10" height="16" rx="1.5" fill="#1a1418"/>
  <g fill="#c8ccd0"><circle cx="48" cy="12" r="1"/><circle cx="52" cy="12" r="1"/><circle cx="48" cy="16" r="1"/><circle cx="52" cy="16" r="1"/><circle cx="48" cy="20" r="1"/><circle cx="52" cy="20" r="1"/></g>
  <rect x="47" y="28" width="6" height="2" fill="#1a1418"/>
  <!-- the ticket dispenser -->
  <rect x="44" y="36" width="12" height="10" rx="2" fill="#f0e8d0" stroke="#6a0a14"/>
  <text x="50" y="43" font-family="sans-serif" font-size="6" font-weight="bold" fill="#c83a3a" text-anchor="middle">42</text>
  <!-- the pickup tray -->
  <rect x="6" y="51" width="36" height="5" rx="1" fill="#0a0608"/>
</svg>
