<svg xmlns="http://www.w3.org/2000/svg" width="128" height="64" viewBox="0 0 128 64">
  <!-- Altar, top-down: a stone slab under a draped cloth, candles at the ends, an offering in the middle. -->
  <defs>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a8278"/><stop offset="1" stop-color="#3a3630"/></linearGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c83a3a"/><stop offset="1" stop-color="#5a0a14"/></linearGradient>
    <radialGradient id="flame" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffffff"/><stop offset="0.4" stop-color="#ffd060"/><stop offset="1" stop-color="#ff6a1a" stop-opacity="0"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0a8"/><stop offset="0.5" stop-color="#d8a838"/><stop offset="1" stop-color="#7a5418"/></linearGradient>
  </defs>
  <rect x="4" y="6" width="120" height="54" rx="4" fill="#000" opacity="0.3"/>
  <rect x="2" y="2" width="120" height="54" rx="4" fill="url(#stone)" stroke="#1e1c18" stroke-width="2"/>
  <path d="M8 8 h108 M8 50 h108" stroke="#ffffff" stroke-width="0.8" opacity="0.15"/>
  <!-- the cloth runner, fringed -->
  <rect x="34" y="4" width="54" height="50" fill="url(#cloth)"/>
  <path d="M34 4 V54 M88 4 V54" stroke="url(#gold)" stroke-width="2.5"/>
  <path d="M36 54 v4 M42 54 v4 M48 54 v4 M54 54 v4 M60 54 v4 M66 54 v4 M72 54 v4 M78 54 v4 M84 54 v4" stroke="#d8a838" stroke-width="1.2"/>
  <!-- the offering: a gold bowl with something glowing -->
  <circle cx="61" cy="29" r="12" fill="url(#gold)" stroke="#5a3a10" stroke-width="1"/>
  <circle cx="61" cy="29" r="7" fill="#2a0a0a"/>
  <circle cx="61" cy="29" r="4" fill="#ff4a6a"/>
  <!-- candles, lit -->
  <g><circle cx="16" cy="16" r="5" fill="#f0e8d8"/><circle cx="16" cy="16" r="6" fill="url(#flame)"/>
     <circle cx="16" cy="42" r="5" fill="#f0e8d8"/><circle cx="16" cy="42" r="6" fill="url(#flame)"/>
     <circle cx="106" cy="16" r="5" fill="#f0e8d8"/><circle cx="106" cy="16" r="6" fill="url(#flame)"/>
     <circle cx="106" cy="42" r="5" fill="#f0e8d8"/><circle cx="106" cy="42" r="6" fill="url(#flame)"/></g>
  <path d="M24 28 h4 M96 28 h4" stroke="#1e1c18" stroke-width="2"/>
</svg>
