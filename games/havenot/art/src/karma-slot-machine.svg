<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Karma slot machine, top-down: a gaudy cabinet, three reels of halos and horns, a lever, a coin tray. -->
  <defs>
    <linearGradient id="cab" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b84ad8"/><stop offset="1" stop-color="#3a0a5a"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0a8"/><stop offset="0.5" stop-color="#d8a838"/><stop offset="1" stop-color="#7a5418"/></linearGradient>
  </defs>
  <rect x="4" y="6" width="54" height="56" rx="6" fill="#000" opacity="0.3"/>
  <rect x="2" y="2" width="54" height="56" rx="6" fill="url(#cab)" stroke="url(#gold)" stroke-width="2.5"/>
  <!-- marquee bulbs -->
  <g fill="#ffe04a"><circle cx="8" cy="6" r="1.6"/><circle cx="16" cy="6" r="1.6"/><circle cx="24" cy="6" r="1.6"/><circle cx="32" cy="6" r="1.6"/><circle cx="40" cy="6" r="1.6"/><circle cx="48" cy="6" r="1.6"/></g>
  <!-- the reels -->
  <rect x="7" y="14" width="44" height="22" rx="2" fill="#f8f4e8" stroke="#2a0a3a" stroke-width="1.5"/>
  <path d="M21.5 14 v22 M36.5 14 v22" stroke="#2a0a3a" stroke-width="1.2"/>
  <ellipse cx="14" cy="25" rx="5" ry="2" fill="none" stroke="#d8a838" stroke-width="1.8"/>
  <path d="M26 30 l3 -9 l2 6 l2 -6 l3 9" fill="#c83a3a"/>
  <ellipse cx="44" cy="25" rx="5" ry="2" fill="none" stroke="#d8a838" stroke-width="1.8"/>
  <!-- buttons and the coin tray -->
  <circle cx="14" cy="44" r="3" fill="#ff3a3a"/><circle cx="24" cy="44" r="3" fill="#3aff6a"/>
  <rect x="32" y="42" width="18" height="10" rx="2" fill="#1a0a24" stroke="url(#gold)"/>
  <g fill="url(#gold)"><circle cx="38" cy="47" r="2"/><circle cx="43" cy="48" r="2"/></g>
  <!-- the lever -->
  <path d="M56 20 L62 20 L62 8" stroke="#c8ccd0" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <circle cx="62" cy="7" r="3" fill="#ff3a3a"/>
</svg>
