<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Sphinx Gun, top-down and aiming north: a reception-desk gun emplacement built as a gilded sphinx, its
       striped headdress spread over the shoulders, paws forward either side of a heavy cannon under the chin,
       a lit question mark on its brow. -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4d88a"/><stop offset="0.5" stop-color="#c89a3a"/><stop offset="1" stop-color="#5a3e10"/></linearGradient>
    <linearGradient id="barrel" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1a1e22"/><stop offset="0.5" stop-color="#6a7078"/><stop offset="1" stop-color="#1a1e22"/></linearGradient>
  </defs>
  <ellipse cx="32" cy="36" rx="26" ry="24" fill="#000" opacity="0.28"/>
  <!-- the body, couchant, behind -->
  <path d="M16 36 Q14 58 32 60 Q50 58 48 36 Z" fill="url(#gold)" stroke="#3a2808" stroke-width="1.3"/>
  <path d="M22 46 Q32 50 42 46 M24 53 Q32 56 40 53" stroke="#3a2808" stroke-width="0.8" fill="none"/>
  <!-- paws, forward -->
  <g fill="url(#gold)" stroke="#3a2808" stroke-width="1.1"><rect x="12" y="10" width="9" height="26" rx="4"/><rect x="43" y="10" width="9" height="26" rx="4"/></g>
  <path d="M14 11 v3 M17 10 v3 M19 11 v3 M45 11 v3 M47 10 v3 M50 11 v3" stroke="#3a2808" stroke-width="0.7"/>
  <!-- the cannon, under the chin -->
  <rect x="27" y="2" width="10" height="24" rx="2.5" fill="url(#barrel)" stroke="#0a0c0e" stroke-width="1"/>
  <rect x="26" y="2" width="12" height="4" rx="1" fill="#2a2e32"/>
  <!-- the headdress, striped, spread to the shoulders -->
  <path d="M18 40 L22 22 Q32 16 42 22 L46 40 Q32 34 18 40 Z" fill="#1e3a8a" stroke="#0a1430" stroke-width="1.2"/>
  <path d="M20 34 L23.5 23 M24 37 L26 21 M28 35.5 L29 19.5 M36 35.5 L35 19.5 M40 37 L38 21 M44 34 L40.5 23" stroke="#f4d88a" stroke-width="1.4"/>
  <!-- the face -->
  <ellipse cx="32" cy="27" rx="6" ry="7" fill="url(#gold)" stroke="#3a2808" stroke-width="1"/>
  <path d="M29 25 h2 M33 25 h2" stroke="#1a1004" stroke-width="1.2"/>
  <!-- the question mark, lit -->
  <circle cx="32" cy="20" r="3.6" fill="#0a1430" stroke="#5ae8ff" stroke-width="0.6"/>
  <path d="M30.6 19.2 Q30.6 17.6 32 17.6 Q33.4 17.6 33.4 18.9 Q33.4 19.9 32 20.4 V21.2" stroke="#5ae8ff" stroke-width="0.9" fill="none" stroke-linecap="round"/>
  <circle cx="32" cy="22.4" r="0.5" fill="#5ae8ff"/>
</svg>
