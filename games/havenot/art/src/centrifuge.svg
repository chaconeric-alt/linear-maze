<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Centrifuge, top-down: a heavy drum on a bolted base, its rotor arms and sample pods under a domed lid. -->
  <defs>
    <radialGradient id="base" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#9aa4ae"/><stop offset="0.7" stop-color="#4a525c"/><stop offset="1" stop-color="#1e2228"/></radialGradient>
    <radialGradient id="well" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#2a3038"/><stop offset="1" stop-color="#0a0c10"/></radialGradient>
    <linearGradient id="arm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e0e6ec"/><stop offset="1" stop-color="#6a747e"/></linearGradient>
    <radialGradient id="pod" cx="0.4" cy="0.35" r="0.7"><stop offset="0" stop-color="#ffd0f0"/><stop offset="0.5" stop-color="#d84aa8"/><stop offset="1" stop-color="#5a1040"/></radialGradient>
  </defs>
  <rect x="6" y="6" width="116" height="116" rx="18" fill="#22262c"/>
  <circle cx="64" cy="64" r="56" fill="url(#base)" stroke="#101216" stroke-width="2"/>
  <g fill="#14181c" stroke="#b8c0c8" stroke-width="0.8"><circle cx="64" cy="12" r="3"/><circle cx="116" cy="64" r="3"/><circle cx="64" cy="116" r="3"/><circle cx="12" cy="64" r="3"/><circle cx="101" cy="27" r="3"/><circle cx="101" cy="101" r="3"/><circle cx="27" cy="101" r="3"/><circle cx="27" cy="27" r="3"/></g>
  <circle cx="64" cy="64" r="44" fill="url(#well)"/>
  <!-- rotor: four arms, a pod on each -->
  <g stroke="#14181c" stroke-width="1.2">
    <rect x="58" y="24" width="12" height="80" rx="4" fill="url(#arm)"/>
    <rect x="24" y="58" width="80" height="12" rx="4" fill="url(#arm)"/>
  </g>
  <circle cx="64" cy="30" r="9" fill="url(#pod)"/><circle cx="98" cy="64" r="9" fill="url(#pod)"/><circle cx="64" cy="98" r="9" fill="url(#pod)"/><circle cx="30" cy="64" r="9" fill="url(#pod)"/>
  <circle cx="64" cy="64" r="11" fill="#3a424a" stroke="#c8d0d8" stroke-width="1.5"/>
  <circle cx="64" cy="64" r="4" fill="#ff4ad8"/>
  <!-- the lid's glass and the speed dial -->
  <circle cx="64" cy="64" r="44" fill="none" stroke="#d8e8f0" stroke-width="2" stroke-opacity="0.5"/>
  <path d="M36 40 A36 36 0 0 1 56 26" stroke="#ffffff" stroke-width="3" opacity="0.45" fill="none"/>
  <rect x="96" y="104" width="20" height="12" rx="2" fill="#0a0c10" stroke="#9aa4ae"/>
  <path d="M100 112 L106 106 L112 110" stroke="#ff4ad8" stroke-width="1.5" fill="none"/>
</svg>
