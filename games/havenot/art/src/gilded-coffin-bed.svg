<svg xmlns="http://www.w3.org/2000/svg" width="64" height="128" viewBox="0 0 64 128">
  <!-- Gilded coffin bed, top-down: a lacquered coffin with gold trim and a velvet-lined half lid open at the head. -->
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1a0c10"/><stop offset="0.5" stop-color="#4a2028"/><stop offset="1" stop-color="#1a0c10"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0a8"/><stop offset="0.5" stop-color="#d8a838"/><stop offset="1" stop-color="#7a5418"/></linearGradient>
    <radialGradient id="velvet" cx="0.5" cy="0.4" r="0.7"><stop offset="0" stop-color="#c8283e"/><stop offset="1" stop-color="#4a0614"/></radialGradient>
  </defs>
  <!-- the shadow it casts -->
  <path d="M18 6 L50 6 L62 30 L54 124 L14 124 L4 30 Z" fill="#000000" opacity="0.35" transform="translate(2 3)"/>
  <!-- the coffin -->
  <path d="M18 4 L46 4 L60 28 L52 122 L12 122 L4 28 Z" fill="url(#wood)" stroke="url(#gold)" stroke-width="2.5"/>
  <!-- the open head: velvet, a pillow -->
  <path d="M20 9 L44 9 L54 28 L52 48 L12 48 L10 28 Z" fill="url(#velvet)"/>
  <ellipse cx="32" cy="24" rx="12" ry="8" fill="#f0d8d0"/>
  <ellipse cx="32" cy="22" rx="9" ry="5" fill="#ffffff" opacity="0.5"/>
  <!-- the closed foot of the lid, with a gold cross and studs -->
  <path d="M12 50 L52 50 L50 120 L14 120 Z" fill="#2a1218" stroke="url(#gold)" stroke-width="1.5"/>
  <rect x="30" y="58" width="4" height="48" fill="url(#gold)"/>
  <rect x="22" y="70" width="20" height="4" fill="url(#gold)"/>
  <g fill="#e8c860"><circle cx="17" cy="56" r="1.4"/><circle cx="47" cy="56" r="1.4"/><circle cx="17" cy="84" r="1.4"/><circle cx="47" cy="84" r="1.4"/><circle cx="18" cy="112" r="1.4"/><circle cx="46" cy="112" r="1.4"/></g>
  <!-- handles -->
  <path d="M3 60 v14 M61 60 v14 M3 92 v14 M61 92 v14" stroke="url(#gold)" stroke-width="3" stroke-linecap="round"/>
  <!-- lacquer sheen -->
  <path d="M16 54 L20 116" stroke="#ffffff" stroke-width="1.5" opacity="0.18"/>
</svg>
