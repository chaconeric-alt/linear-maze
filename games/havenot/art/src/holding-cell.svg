<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Holding cell, top-down: a barred cage on a concrete floor, a bunk, a bucket, a locked door with a light. -->
  <defs>
    <linearGradient id="floor" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6a6a64"/><stop offset="1" stop-color="#3a3a36"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3a4046"/><stop offset="0.5" stop-color="#c8d0d8"/><stop offset="1" stop-color="#3a4046"/></linearGradient>
  </defs>
  <rect x="4" y="6" width="122" height="120" rx="4" fill="#000" opacity="0.3"/>
  <rect x="2" y="2" width="122" height="120" rx="3" fill="url(#floor)"/>
  <path d="M10 40 l14 6 M70 90 l12 -4 M90 30 l8 8" stroke="#2a2a26" stroke-width="1" opacity="0.6"/>
  <!-- the bunk and its blanket -->
  <rect x="10" y="10" width="34" height="62" rx="2" fill="#4a4a44" stroke="#1a1a18"/>
  <rect x="12" y="24" width="30" height="46" rx="2" fill="#5a6a4a"/>
  <rect x="14" y="12" width="26" height="12" rx="4" fill="#d8d4c8"/>
  <!-- the bucket and a tally on the floor -->
  <circle cx="98" cy="96" r="9" fill="#5a5048" stroke="#1a1a18"/><circle cx="98" cy="96" r="6" fill="#2a2420"/>
  <path d="M60 104 v8 M64 104 v8 M68 104 v8 M72 104 v8 M58 110 l16 -4" stroke="#d8d4c8" stroke-width="1.2"/>
  <!-- the bars, all round -->
  <g fill="url(#bar)">
    <rect x="2" y="2" width="122" height="5"/><rect x="2" y="117" width="122" height="5"/><rect x="2" y="2" width="5" height="120"/><rect x="119" y="2" width="5" height="120"/>
  </g>
  <g stroke="#9aa4ae" stroke-width="2.4">
    <path d="M18 7 v-5 M30 7 v-5 M42 7 v-5 M54 7 v-5 M66 7 v-5 M78 7 v-5 M90 7 v-5 M102 7 v-5 M114 7 v-5"/>
    <path d="M18 117 v5 M30 117 v5 M42 117 v5 M54 117 v5 M90 117 v5 M102 117 v5 M114 117 v5"/>
  </g>
  <!-- the door: a hinged section on the south side, padlocked, its light red -->
  <rect x="60" y="114" width="26" height="10" fill="#2a3036" stroke="#c8d0d8" stroke-width="1"/>
  <rect x="70" y="116" width="6" height="6" rx="1" fill="#c8a040"/>
  <circle cx="92" cy="119" r="2.5" fill="#ff2a2a"/>
</svg>
