<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Metallic cocoon, top-down: a Chatterpillar's chrysalis spun from scrap, overlapping riveted plates in an
       egg shape, glued down with yellow resin, something curled up and faintly glowing showing through a seam. -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3a3a30"/><stop offset="0.5" stop-color="#a8a890"/><stop offset="1" stop-color="#3a3a30"/></linearGradient>
  </defs>
  <ellipse cx="32" cy="34" rx="24" ry="28" fill="#000" opacity="0.25"/>
  <!-- resin, holding it down -->
  <path d="M10 44 Q6 54 14 58 Q22 54 20 46 Z M54 44 Q58 54 50 58 Q42 54 44 46 Z M28 58 Q32 64 36 58 Z" fill="#c8b24a" opacity="0.85"/>
  <!-- the shell, plate over plate -->
  <ellipse cx="32" cy="32" rx="21" ry="27" fill="#2a2a24"/>
  <g stroke="#1e1e18" stroke-width="1.1" fill="url(#plate)">
    <path d="M13 44 Q32 54 51 44 Q50 56 32 59 Q14 56 13 44 Z"/>
    <path d="M12 34 Q32 44 52 34 Q53 42 51 46 Q32 54 13 46 Q11 42 12 34 Z"/>
    <path d="M13 24 Q32 34 51 24 Q53 30 52 36 Q32 46 12 36 Q11 30 13 24 Z"/>
    <path d="M17 14 Q32 24 47 14 Q50 20 51 26 Q32 36 13 26 Q14 20 17 14 Z"/>
    <path d="M24 6 Q32 4 40 6 Q45 10 47 16 Q32 26 17 16 Q19 10 24 6 Z"/>
  </g>
  <g fill="#5a5a4a"><circle cx="20" cy="22" r="0.9"/><circle cx="44" cy="22" r="0.9"/><circle cx="17" cy="32" r="0.9"/><circle cx="47" cy="32" r="0.9"/><circle cx="19" cy="43" r="0.9"/><circle cx="45" cy="43" r="0.9"/><circle cx="32" cy="12" r="0.9"/></g>
  <!-- the seam, and what's inside -->
  <path d="M30 18 L34 26 L29 34 L35 42" stroke="#0a0a06" stroke-width="2.4" fill="none"/>
  <path d="M30 18 L34 26 L29 34 L35 42" stroke="#ffd84a" stroke-width="0.8" fill="none" opacity="0.8"/>
  <circle cx="32" cy="30" r="1.4" fill="#ff4a2a"/>
</svg>
