<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Your old maintenance bot, top-down and facing north: a dented green service drone you patched back
       together, a round shell held with tape, one big friendly green lens, two tool arms forward, a heart
       painted on its back, little castor wheels. -->
  <defs>
    <radialGradient id="shell" cx="0.4" cy="0.35" r="0.7"><stop offset="0" stop-color="#9ad0a8"/><stop offset="0.55" stop-color="#4a7a5a"/><stop offset="1" stop-color="#1a2e22"/></radialGradient>
    <radialGradient id="lens" cx="0.4" cy="0.35" r="0.6"><stop offset="0" stop-color="#ffffff"/><stop offset="0.35" stop-color="#7affb0"/><stop offset="1" stop-color="#0a4a2a"/></radialGradient>
  </defs>
  <ellipse cx="32" cy="35" rx="22" ry="20" fill="#000" opacity="0.28"/>
  <!-- castors -->
  <g fill="#1a1a1a" stroke="#4a4a4a" stroke-width="0.8"><rect x="10" y="22" width="6" height="9" rx="2"/><rect x="48" y="22" width="6" height="9" rx="2"/><rect x="10" y="40" width="6" height="9" rx="2"/><rect x="48" y="40" width="6" height="9" rx="2"/></g>
  <!-- tool arms: a gripper and a screwdriver -->
  <path d="M24 22 L20 10" stroke="#c8d8c8" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M40 22 L44 10" stroke="#c8d8c8" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M17 9 L20 6 L23 9 M20 6 V3" stroke="#8a9a8a" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <path d="M44 10 L45 2" stroke="#e8c030" stroke-width="1.8" stroke-linecap="round"/>
  <!-- the shell -->
  <circle cx="32" cy="34" r="17" fill="url(#shell)" stroke="#12201a" stroke-width="1.6"/>
  <path d="M18 40 Q22 44 20 48" stroke="#12201a" stroke-width="1" fill="none"/>
  <!-- tape, holding it together -->
  <path d="M20 26 L28 22 M21 29 L29 25" stroke="#d8d0b0" stroke-width="2.6" stroke-linecap="square"/>
  <path d="M40 46 L48 40" stroke="#d8d0b0" stroke-width="2.6"/>
  <!-- the painted heart -->
  <path d="M32 50 Q26 45 28 42 Q30 40 32 43 Q34 40 36 42 Q38 45 32 50 Z" fill="#e85a6a"/>
  <!-- the lens, forward -->
  <circle cx="32" cy="27" r="7" fill="#0e1a14" stroke="#3a4a40" stroke-width="1.2"/>
  <circle cx="32" cy="27" r="5" fill="url(#lens)"/>
  <circle cx="30.4" cy="25.4" r="1.2" fill="#ffffff"/>
</svg>
