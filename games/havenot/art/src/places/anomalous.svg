    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0b070"/><stop offset="1" stop-color="#a8703a"/></linearGradient>
    <linearGradient id="sandDark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b8844a"/><stop offset="1" stop-color="#6a4222"/></linearGradient>
    <linearGradient id="concrete" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9a948a"/><stop offset="0.6" stop-color="#7a746a"/><stop offset="1" stop-color="#4a463e"/></linearGradient>
    <linearGradient id="glassG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5ae8b0"/><stop offset="1" stop-color="#1a4a3a"/></linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a8e94"/><stop offset="0.5" stop-color="#4a4e54"/><stop offset="1" stop-color="#1a1c20"/></linearGradient>
    <radialGradient id="dark" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#000000"/><stop offset="0.7" stop-color="#0a0806"/><stop offset="1" stop-color="#2a1e10"/></radialGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fff4d0"/><stop offset="0.4" stop-color="#ffd890" stop-opacity="0.8"/><stop offset="1" stop-color="#ffd890" stop-opacity="0"/></radialGradient>
    <pattern id="haz" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#1a1a1a"/><rect width="4" height="8" fill="#e8c030"/></pattern>
  </defs>
  <!-- The Anomalous Structure: an agency office block half sunk in the dunes and leaning a few degrees, as if it
       had settled into the sand all at once; dusk, its windows glowing a faint wrong green, a dune banked against
       its side, broken masts on the roof, the company's smiley still on the facade. -->
  <rect width="320" height="200" fill="url(#dusk)"/>
  <circle cx="250" cy="70" r="40" fill="url(#sun)"/>
  <path d="M0 132 Q60 118 120 128 Q200 112 320 124 V200 H0 Z" fill="#c89058" opacity="0.6"/>
  <g transform="rotate(-7 160 150)">
    <rect x="96" y="30" width="122" height="140" fill="url(#concrete)" stroke="#2a241e" stroke-width="1.6"/>
    <rect x="96" y="30" width="122" height="8" fill="#5a544a"/>
    <g fill="url(#glassG)" stroke="#1a2a24" stroke-width="0.8">
