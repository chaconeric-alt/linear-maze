      <rect x="106" y="70" width="22" height="14" opacity="0.5"/><rect x="134" y="70" width="22" height="14"/><rect x="162" y="70" width="22" height="14" opacity="0.35"/><rect x="190" y="70" width="20" height="14"/>
      <rect x="106" y="94" width="22" height="14"/><rect x="134" y="94" width="22" height="14" opacity="0.4"/><rect x="162" y="94" width="22" height="14"/><rect x="190" y="94" width="20" height="14" opacity="0.5"/>
    </g>
    <path d="M140 46 l6 14 M168 94 l-4 10 M112 70 l10 12" stroke="#0a0a0a" stroke-width="0.8"/>
    <circle cx="200" cy="124" r="9" fill="#ffd84a" stroke="#6a4a06" stroke-width="1"/>
    <circle cx="197" cy="122" r="1" fill="#2a2010"/><circle cx="203" cy="122" r="1" fill="#2a2010"/><path d="M196 126 Q200 129 204 126" stroke="#2a2010" stroke-width="1" fill="none"/>
    <path d="M110 30 V8 M110 14 l-6 -4 M110 14 l6 -4 M186 30 V14 L180 6" stroke="#2a241e" stroke-width="2" fill="none"/>
    <circle cx="110" cy="8" r="2" fill="#ff3a2a"/>
