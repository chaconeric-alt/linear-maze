<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Monoid, top-down and facing north: a thin black skeletal humanoid robot, a domed sensor head with a
       single forward lens, a narrow shoulder bar, long piston arms hanging forward, cabled spine. -->
  <defs>
    <radialGradient id="dome" cx="0.4" cy="0.35" r="0.7"><stop offset="0" stop-color="#8a9098"/><stop offset="0.55" stop-color="#2a2e34"/><stop offset="1" stop-color="#0a0c0e"/></radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a6068"/><stop offset="1" stop-color="#14181c"/></linearGradient>
  </defs>
  <ellipse cx="32" cy="34" rx="20" ry="13" fill="#000" opacity="0.28"/>
  <!-- the feet, a step apart (seen past the body) -->
  <g fill="#1a1e22" stroke="#5a6068" stroke-width="0.8"><rect x="22" y="36" width="6" height="12" rx="2"/><rect x="36" y="26" width="6" height="12" rx="2"/></g>
  <!-- the arms, long, pistoned, hands forward -->
  <g stroke="#0a0c0e" stroke-width="1" fill="url(#bar)">
    <rect x="10" y="20" width="5" height="22" rx="2"/><rect x="49" y="20" width="5" height="22" rx="2"/>
  </g>
  <path d="M12.5 22 v18 M51.5 22 v18" stroke="#9aa0a8" stroke-width="0.8"/>
  <g fill="#3a4048" stroke="#0a0c0e" stroke-width="0.8"><path d="M9 20 L10 13 L12 18 L13 12 L15 18 L16 13 L16 20 Z"/><path d="M48 20 L48 13 L50 18 L51 12 L52 18 L54 13 L55 20 Z"/></g>
  <!-- the shoulder bar and the spine -->
  <rect x="10" y="28" width="44" height="7" rx="3.5" fill="url(#bar)" stroke="#0a0c0e" stroke-width="1"/>
  <circle cx="13" cy="31.5" r="2.6" fill="#8a9098"/><circle cx="51" cy="31.5" r="2.6" fill="#8a9098"/>
  <path d="M32 35 v14" stroke="#14181c" stroke-width="5" stroke-linecap="round"/>
  <path d="M30 36 v12 M34 36 v12" stroke="#8a6a3a" stroke-width="0.8"/>
  <!-- the head: a dome with one lens, forward -->
  <circle cx="32" cy="26" r="8" fill="url(#dome)" stroke="#0a0c0e" stroke-width="1.2"/>
  <circle cx="32" cy="26" r="5" fill="none" stroke="#5a6068" stroke-width="0.8"/>
  <rect x="29" y="16" width="6" height="5" rx="1.5" fill="#14181c" stroke="#5a6068" stroke-width="0.6"/>
  <circle cx="32" cy="18" r="1.8" fill="#ff4a3a"/><circle cx="31.4" cy="17.4" r="0.6" fill="#ffd0c0"/>
</svg>
