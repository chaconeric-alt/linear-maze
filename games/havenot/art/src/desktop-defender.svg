<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Desktop Defender, top-down and facing north: a red office stapler gone feral, its grey anvil plate,
       two googly eyes at the hinge end, false teeth and a pink tongue lolling out the front, hairy brown legs
       scuttling out both sides. -->
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6a0e0e"/><stop offset="0.45" stop-color="#d82a2a"/><stop offset="1" stop-color="#6a0e0e"/></linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6a7078"/><stop offset="0.5" stop-color="#d0d4d8"/><stop offset="1" stop-color="#6a7078"/></linearGradient>
  </defs>
  <ellipse cx="32" cy="34" rx="14" ry="26" fill="#000" opacity="0.28"/>
  <!-- legs, hairy, jointed -->
  <g stroke="#4a2c14" stroke-width="2.4" stroke-linecap="round" fill="none">
    <path d="M24 22 L14 18 L8 22 M24 30 L12 30 L6 36 M24 38 L12 42 L8 48 M24 46 L14 52 L12 58"/>
    <path d="M40 22 L50 18 L56 22 M40 30 L52 30 L58 36 M40 38 L52 42 L56 48 M40 46 L50 52 L52 58"/>
  </g>
  <g stroke="#8a5a2a" stroke-width="0.8" fill="none" opacity="0.8">
    <path d="M14 18 l-1 -2 M12 30 l-1 -2 M12 42 l-1 -2 M14 52 l-1 -2 M50 18 l1 -2 M52 30 l1 -2 M52 42 l1 -2 M50 52 l1 -2"/>
  </g>
  <!-- the base, sticking out a little -->
  <rect x="21" y="10" width="22" height="50" rx="3" fill="#8a1414" stroke="#2a0606" stroke-width="1.2"/>
  <!-- the top arm -->
  <rect x="23" y="14" width="18" height="46" rx="4" fill="url(#red)" stroke="#2a0606" stroke-width="1.2"/>
  <rect x="26" y="40" width="12" height="16" rx="2" fill="#1e1416" opacity="0.7"/>
  <rect x="27" y="12" width="10" height="20" rx="2" fill="url(#steel)" stroke="#3a3e44" stroke-width="0.8"/>
  <path d="M29 16 h6 M29 19 h6 M29 22 h6" stroke="#5a6068" stroke-width="0.7"/>
  <!-- the mouth: false teeth and a tongue lolling out the front -->
  <path d="M26 8 Q32 -1 38 8 Q32 6 26 8 Z" fill="#f0a0b0" stroke="#8a3a4a" stroke-width="0.8"/>
  <path d="M32 3 v4" stroke="#c86a7a" stroke-width="0.6"/>
  <g fill="#f4ecd0" stroke="#8a7a5a" stroke-width="0.5"><rect x="24" y="8" width="3" height="3" rx="0.8"/><rect x="27" y="8" width="3" height="3.4" rx="0.8"/><rect x="30" y="8" width="4" height="3.6" rx="0.8"/><rect x="34" y="8" width="3" height="3.4" rx="0.8"/><rect x="37" y="8" width="3" height="3" rx="0.8"/></g>
  <!-- the googly eyes, on top of the hinge end -->
  <circle cx="26" cy="54" r="5" fill="#ffffff" stroke="#3a3a3a" stroke-width="0.8"/><circle cx="38" cy="54" r="5" fill="#ffffff" stroke="#3a3a3a" stroke-width="0.8"/>
  <circle cx="26" cy="51.5" r="2.4" fill="#141414"/><circle cx="38" cy="51.5" r="2.4" fill="#141414"/>
</svg>
